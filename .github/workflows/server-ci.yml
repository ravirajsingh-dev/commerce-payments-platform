name: Full Stack CI

on:
  push:
    paths:
      - "server/**"
      - "client/**"
      - "admin/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "server/**"
      - "client/**"
      - "admin/**"
      - ".github/workflows/server-ci.yml"

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint architecture guardrails (server)
        run: npm run lint:arch

      - name: Run server test suite
        run: npm run test:ci

  client-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: client/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint client
        run: npm run lint
      - name: Test client
        run: npm run test
      - name: Build client
        run: npm run build

  admin-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: admin/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint admin
        run: npm run lint
      - name: Test admin
        run: npm run test
      - name: Build admin
        run: npm run build

  quality-gate:
    runs-on: ubuntu-latest
    needs: [server-tests, client-quality, admin-quality]
    steps:
      - name: All checks passed
        run: echo "All required checks passed."
